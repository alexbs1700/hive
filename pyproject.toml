[project]
name = "hive"
version = "0.1.0"
description = "A from-scratch Hive board game engine, built as the future environment for a self-play-trained GANN."
readme = "README.md"
authors = [
    { name = "alexbs17", email = "alexbs1700@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
]

[project.optional-dependencies]
alphazero = [
    "torch>=2.2",
    "numpy>=1.26",
    "mlflow>=2.14",
    "tqdm>=4.66",
]

[project.scripts]
hive-play = "hive.cli:main"
hive-demo = "hive.demo:main"
hive-web = "hive.webapp.server:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["hive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
